<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>BMW M3 Competition xDrive Care Plan</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="M3 Care" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

    <style>
      /* Branded loading splash — shown until React mounts */
      #boot-splash {
        position: fixed;
        inset: 0;
        background: #0d0d0d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #boot-splash.hide { opacity: 0; pointer-events: none; }
      .boot-stripe { display: flex; gap: 2px; height: 46px; align-items: stretch; transform: skewX(-26deg); }
      .boot-ms { width: 18px; animation: bootpulse 1.4s ease-in-out infinite; }
      .boot-ms:nth-child(1) { background: #1c2e6e; animation-delay: 0s; }
      .boot-ms:nth-child(2) { background: #0066b1; animation-delay: 0.18s; }
      .boot-ms:nth-child(3) { background: #cc1e1e; animation-delay: 0.36s; }
      @keyframes bootpulse {
        0%, 100% { opacity: 0.35; transform: scaleY(0.82); }
        50% { opacity: 1; transform: scaleY(1); }
      }
      .boot-text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="boot-stripe">
        <div class="boot-ms"></div>
        <div class="boot-ms"></div>
        <div class="boot-ms"></div>
      </div>
      <div class="boot-text">M3 Care Plan</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Service worker registration + automatic updates -->
    <script>
      // Three things are needed for a deploy to reach an open PWA:
      //
      //  1. updateViaCache:'none' - GitHub Pages serves sw.js with
      //     cache-control: max-age=600, so without this the browser can keep
      //     handing back a stale sw.js for 10 minutes and never notice a new one.
      //  2. An explicit reg.update() - browsers only check for a new worker on
      //     navigation, and an installed PWA left open may never navigate.
      //  3. A reload - skipWaiting()/clients.claim() swap the worker, but the
      //     page keeps running the JS bundle it already loaded.
      //
      // The reload is deferred until the tab is hidden or has just been
      // refocused, so an update never interrupts what you're doing.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          // If there is no controller yet this is a first install, and the
          // controllerchange that follows is not an update - don't reload for it.
          const hadController = !!navigator.serviceWorker.controller

          let reg
          try {
            reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
          } catch { return }

          const checkForUpdate = () => { reg.update().catch(() => {}) }
          setInterval(checkForUpdate, 60000)

          let updateReady = false
          let reloading = false
          const reloadIfSafe = () => {
            if (!updateReady || reloading) return
            reloading = true
            location.reload()
          }

          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController) return
            updateReady = true
            if (document.hidden) reloadIfSafe()
          })

          document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
              reloadIfSafe()
            } else {
              checkForUpdate()
              reloadIfSafe()
            }
          })
        })
      }
    </script>
  </body>
</html>
