name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backups/**'   # backup commits must not trigger a site rebuild

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bump service worker cache version
        run: |
          # Generate a version string from the short commit SHA
          VERSION="m3care-$(git rev-parse --short HEAD)"
          echo "SW cache version: $VERSION"
          # Replace whatever version is currently in sw.js
          sed -i "s/const CACHE = 'm3care-[^']*'/const CACHE = '$VERSION'/" public/sw.js
          grep "const CACHE" public/sw.js

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
