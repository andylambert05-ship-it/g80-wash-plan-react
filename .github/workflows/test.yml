name: Worker tests

# Runs the Worker suite in the real workerd runtime with a local D1.
# deploy.yml waits on this, so a red test blocks the deploy rather than
# landing red next to a green one.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backups/**'
  pull_request:
    branches: [main]
  workflow_call:        # lets deploy.yml depend on this

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
